<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>An API client that talks to a server.</p>
  </header>

  <main>
    <p id="status" role="status"></p>

    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="title-input">Title</label>
        <input type="text" id="title-input" name="title" placeholder="Note title">

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" name="body" rows="4" placeholder="Write the details"></textarea>

        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>

    <section>
      <h2>Your notes</h2>
      <button type="button" id="load-btn">Load notes</button>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes 2026</p>
  </footer>
</body>
</html>
